<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Android Settings Shortcuts</title>
<style>
  :root {
    --bg: #f4f6f8;
    --fg: #14202b;
    --muted: #5b6b79;
    --btn: #0b6e4f;
    --btn-fg: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10181f;
      --fg: #e8eef3;
      --muted: #93a4b3;
      --btn: #3ecf9a;
      --btn-fg: #08241a;
    }
  }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a.btn {
    display: block;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-radius: 10px;
    background: var(--btn);
    color: var(--btn-fg);
    text-decoration: none;
    font-weight: 600;
  }
  a.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #note { margin-top: 16px; font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Open Android settings</h1>
  <p>Tap a button. Works in Chrome on Android.</p>

  <a class="btn" href="intent:#Intent;action=android.settings.SETTINGS;end">Settings</a>
  <a class="btn" href="intent:#Intent;action=android.settings.WIFI_SETTINGS;end">Wi-Fi</a>
  <a class="btn" href="intent:#Intent;action=android.settings.BLUETOOTH_SETTINGS;end">Bluetooth</a>
  <a class="btn" href="intent:#Intent;action=android.settings.DISPLAY_SETTINGS;end">Display</a>
  <a class="btn" href="intent:#Intent;action=android.settings.LOCATION_SOURCE_SETTINGS;end">Location</a>
  <a class="btn" href="intent:#Intent;action=android.settings.APPLICATION_SETTINGS;end">Apps</a>

  <p id="note"></p>
</main>
<script>
  if (!/Android/i.test(navigator.userAgent)) {
    document.getElementById("note").textContent =
      "These buttons only work on an Android device.";
  }
</script>
</body>
</html>
