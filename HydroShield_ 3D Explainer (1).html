bx(2,.12,.8,0x2b3a44,6.6,.06,.6);const leds=[0x22c55e,0xfacc15,0xef4444].map((c,i)=>{const m=new T.Mesh(new T.SphereGeometry(.22,16,12),new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:0}));m.position.set(6+i*.6,.3,.6);scene.add(m);return m});

const c1=new T.CatmullRomCurve3([V(5.4,.5,-2.4),V(6.2,1.8,-4.4),V(6.8,1.1,-6.5)]),c2=new T.CatmullRomCurve3([V(6.8,1.1,-6.5),V(8,2.2,-5.2),V(8.7,2.3,-3.7)]);
const pk=[0,1,2].map(()=>{const m=new T.Mesh(new T.SphereGeometry(.14,12,10),new T.MeshBasicMaterial({color:0xffb020}));scene.add(m);return m});

const c=new T.CatmullRomCurve3([a,V(a.x,a.y+.5,a.z),mid,V(b.x,b.y+.5,b.z),b]);const g=new T.TubeGeometry(c,48,r||.045,6);
const m=new T.Mesh(g,M(col,{roughness:.4}));scene.add(m);const pl=new T.Mesh(new T.SphereGeometry(.1,10,8),new T.MeshBasicMaterial({color:0xffffff}));scene.add(pl);
wires.push({c,g,m,pl,step,p:0,n:g.index.count,o:Math.random()})}
const DB=V(-.9,.4,1.2);
W(V(-9.2,3.2,-2.5),V(-10.3,.5,2.4),0x222222,2,1.6,.06);W(V(-7.9,3.2,-2.5),V(-7.3,.3,1.75),0x222222,2,1.4,.06);W(V(-6.6,3.1,-2.5),V(-5.4,.3,1.75),0x222222,2,1.2,.06);

/* ---------- steps ---------- */
const S=[
['The system at a glance','Four sensors sit in flowing water. Their signals pass through interface modules straight into an Arduino Uno, which converts them to readings, shows them on a display, and sends them to a NodeMCU ESP8266. The NodeMCU forwards them over Wi-Fi to the backend and dashboard.',[0,1,0,22,.25,.5]],
['Sensors measure the water','pH: a glass electrode makes a tiny voltage, about 59 mV per pH unit at 25 °C. TDS: the probe measures electrical conductivity, shown as ppm. Turbidity: light crosses from an LED to a detector, and cloudier water scatters more of it (NTU). DS18B20: a digital chip that reports temperature.',[-7,1.4,-2.5,10,.35,.22]],
['Interface modules prepare the signals','A pH probe’s millivolts are too small to read directly, so its module amplifies them to a 0–5 V signal. The TDS and turbidity modules also output analog voltages. Only the DS18B20 is already digital.',[-6.5,1,.5,12,.1,.45]],
['Wiring to the Arduino','The three analog outputs go directly to Arduino pins A0 (pH), A1 (TDS) and A2 (turbidity). The DS18B20 data wire has a 4.7 kΩ pull-up resistor and runs to pin D2. Everything shares 5 V and ground.',[2,.5,1.6,15,.15,.6]],
['The Arduino’s built-in ADC','Each analog pin feeds the Uno’s own 10-bit ADC, so readings are 0–1023. With the default 5 V reference, one step is about 4.9 mV. Averaging several samples per reading reduces noise. Module outputs must stay between 0 and 5 V.',[4,.5,1.5,9,.2,.55]],
['Arduino converts and packs the data','The Arduino turns counts into volts, then into pH, TDS (ppm) and turbidity (NTU) with calibration formulas. It corrects TDS for temperature (about 2 % per °C), picks a status, and draws the results on the 2.4″ TFT. Then it packs one reading into a single JSON line. The calibration equations must match your exact sensor modules.',[5.5,.5,1.5,10,.3,.5]],
['Serial JSON to the NodeMCU','Once per reading, the Arduino sends one JSON line ending in a newline, at 9600 baud from D3. The NodeMCU reads a full line, checks that it parses, and forwards it unchanged to the backend. ESP8266 GPIO uses 3.3 V logic: never apply 5 V directly to its pins. A voltage divider or level shifter sits between Arduino TX and NodeMCU RX, with a shared ground.',[5.5,1,-2.8,10,-.1,.6]],
['Live dashboard','This is an illustrative layout, not your live site, and no backend connection is claimed. Each value gets a status from configurable thresholds. These four readings alone do not certify drinking-water safety.',[8.6,1.8,-1.8,9.5,-.35,.3]],
['Status: safe, caution or not safe','Green means every reading is inside its configured normal range. Yellow means a reading entered a warning range. Red means a limit was exceeded. A failed or invalid sensor never counts as SAFE. These thresholds are examples to configure for your application.',[7.5,1,.8,11,-.05,.4]],
['Automatic reporting every 10 minutes','The reporting interval is a software setting. Readings are checked before upload. If Wi-Fi drops, the NodeMCU keeps trying to reconnect and then resends the stored reading, so a failed upload is retried rather than ignored.',[5.5,1.2,-3.5,13,-.2,.55]],
['HydroShield','Smart IoT water quality monitoring system. Measure, monitor, connect.',[1,1.2,-.5,26,.6,.4]]];
const PN={4:'<h3>Arduino ADC</h3><pre>counts = analogRead(A0); // 0–1023\nvolts  = counts × 5.0 / 1023.0</pre><div>10 bits, 5 V reference: about 4.9 mV per step. Average several reads per channel.</div>',
6:'<h3>Serial line (Arduino → NodeMCU)</h3><pre>{"ph":7.20,"tds":280,"turbidity":1.50,"temperature":28.5,"status":"SAFE"}\\n</pre><div>Demo data only. The newline marks the end of each reading. The NodeMCU would POST this same JSON to your website’s configured backend API. No endpoint is assumed here: the site needs a working endpoint and matching authentication.</div>',
9:'<h3>Reporting timeline</h3><pre>00:00 sensors measure\n00:10 monitoring continues\n10:00 record uploaded\n20:00 record uploaded\n30:00 charts updated</pre><div>The interval is configurable. If Wi-Fi is lost: reconnect, then retry the upload.</div>',10:'<h3>HYDROSHIELD</h3><div>SMART IoT WATER QUALITY MONITORING SYSTEM</div><div><b>MEASURE • MONITOR • CONNECT</b></div><div>hydroshield2.vercel.app</div>'};
let step=0,play=true,sT=0,drag={y:0,p:0};const DUR=15;
const cur={tx:0,ty:1,tz:0,d:22,yaw:.25,pitch:.5},K=['tx','ty','tz','d','yaw','pitch'];
const $=id=>document.getElementById(id),dots=$('dots');
S.forEach((s,i)=>{const b=document.createElement('button');b.className='d';b.setAttribute('aria-label','Step '+(i+1)+': '+s[0]);b.onclick=()=>go(i);dots.appendChild(b)});
function go(n){step=(n+S.length)%S.length;sT=0;drag={y:0,p:0};$('tt').textContent=(step+1)+'. '+S[step][0];$('tx').textContent=S[step][1];
[...dots.children].forEach((d,i)=>d.classList.toggle('on',i===step));const pn=PN[step];$('jp').style.display=pn?'block':'none';$('jp').innerHTML=pn||''}
$('pv').onclick=()=>go(step-1);$('nx').onclick=()=>go(step+1);$('pl').onclick=()=>{play=!play;$('pl').textContent=play?'Pause':'Play'};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1)});
let dn=null;const cv=ren.domElement;
cv.onpointerdown=e=>{dn=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointerup=()=>dn=null;
cv.onpointermove=e=>{if(!dn)return;drag.y-=(e.clientX-dn[0])*.006;drag.p=Math.max(-.4,Math.min(.5,drag.p+(e.clientY-dn[1])*.004));dn=[e.clientX,e.clientY]};
function size(){ren.setSize(app.clientWidth,app.clientHeight);cam.aspect=app.clientWidth/app.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();go(0);K.forEach((k,i)=>cur[k]=S[0][2][i]);

/* ---------- screens ---------- */
function screens(){
const [sn,sc]=stat(),a=lcd.x;a.fillStyle='#0b1d14';a.fillRect(0,0,320,240);a.font='bold 22px monospace';a.fillStyle='#3ddc84';
if(step<5){a.fillText('Waiting for data…',30,120)}else{a.fillText('pH   '+R.ph.toFixed(2),20,50);a.fillText('TDS  '+R.tds.toFixed(0)+' ppm',20,95);a.fillText('NTU  '+R.ntu.toFixed(1),20,140);a.fillText('Temp '+R.t.toFixed(1)+' C',20,185);a.fillStyle=sc;a.fillText(sn,20,225)}
lcd.t.needsUpdate=true;
const d=dash.x;d.fillStyle='#10202a';d.fillRect(0,0,512,300);d.fillStyle='#e3f1f7';d.font='bold 22px system-ui';d.fillText('HydroShield',20,38);
if(step<7){d.font='18px system-ui';d.fillText('No data yet',20,100)}else{d.font='20px system-ui';[['pH',R.ph.toFixed(2)],['TDS',R.tds.toFixed(0)+' ppm'],['Turbidity',R.ntu.toFixed(1)+' NTU'],['Temp',R.t.toFixed(1)+' °C']].forEach((r,i)=>{d.fillStyle='#8fb3c4';d.fillText(r[0],30+(i%2)*240,90+Math.floor(i/2)*70);d.fillStyle='#e3f1f7';d.fillText(r[1],30+(i%2)*240,120+Math.floor(i/2)*70)});d.fillStyle=sc;d.font='bold 30px system-ui';d.fillText(sn,30,260)}
dash.t.needsUpdate=true}

/* ---------- loop ---------- */
const clk=new T.Clock();let t=0;const pv=V(0,0,0);
function frame(){requestAnimationFrame(frame);const dt=Math.min(clk.getDelta(),.05);t+=dt;if(play){sT+=dt;if(sT>DUR&&step<S.length-1)go(step+1)}
updR(t);const tg=S[step][2],k=Math.min(1,dt*3);K.forEach((n,i)=>cur[n]+=(tg[i]-cur[n])*k);
const yw=cur.yaw+drag.y+(play?Math.sin(t*.15)*.12:0),pt=cur.pitch+drag.p;
cam.position.set(cur.tx+cur.d*Math.sin(yw)*Math.cos(pt),cur.ty+cur.d*Math.sin(pt),cur.tz+cur.d*Math.cos(yw)*Math.cos(pt));cam.lookAt(cur.tx,cur.ty,cur.tz);
for(let i=0;i<N;i++){pp[i*3]+=dt*.7;if(pp[i*3]>2.9)pp[i*3]=-2.9}pg.attributes.position.needsUpdate=true;
beam.material.opacity=.3+.2*Math.sin(t*5);
wires.forEach(w=>{w.p+=((step>=w.step?1:0)-w.p)*Math.min(1,dt*2);w.g.setDrawRange(0,Math.floor(w.n*w.p/3)*3);w.m.visible=w.p>.01;w.pl.visible=w.p>.98;if(w.pl.visible)w.pl.position.copy(w.c.getPoint((t*.4+w.o)%1))});
rings.forEach((r,i)=>{const s=(t*.5+i/3)%1;r.visible=step>=6;r.scale.setScalar(.5+s*2.5);r.material.opacity=(1-s)*.6});
pk.forEach((m,i)=>{const u=(t*.25+i/3)%1;m.visible=step>=6;m.position.copy(u<.5?c1.getPoint(u*2):c2.getPoint(u*2-1))});
const sc=stat()[0];leds.forEach((l,i)=>{const on=step>=5&&((sc==='SAFE'&&i===0)||(sc==='CAUTION'&&i===1)||(sc!=='SAFE'&&sc!=='CAUTION'&&i===2));l.material.emissiveIntensity=on?1.2:0});
screens();
const w=app.clientWidth,h=app.clientHeight;
labs.forEach(l=>{const vis=step>=l.a&&step<=l.b;pv.copy(l.p).project(cam);if(!vis||pv.z>1){l.e.style.display='none';return}
if(l.f)l.e.textContent=l.f();l.e.style.display='block';l.e.style.left=(pv.x*.5+.5)*w+'px';l.e.style.top=(-pv.y*.5+.5)*h+'px'});
ren.render(scene,cam)}
frame();
</script></body></html>
